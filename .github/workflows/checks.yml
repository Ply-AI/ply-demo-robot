name: Demo checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Check source, fixtures, traceability and behavior
        run: python tools/check.py
      - name: Run the complete demo
        run: python -m scrub_s2 --json
